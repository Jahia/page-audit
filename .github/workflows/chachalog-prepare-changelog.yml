# DO NOT EDIT
# This file is managed globally at https://github.com/Jahia/.github
name: Chachalog - Prepare Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch: null

jobs:
  prepare-changelog:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_API_TOKEN }}

      - name: Is repo whitelisted?
        id: wl
        uses: jahia/jahia-modules-action/changelog-is-whitelisted@v2
        with:
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GH_API_TOKEN }}

      # If the repo does not contain a Chachalog config, this action
      # handles the creation of a default configuration, that should be
      # sufficient to get started
      - uses: jahia/jahia-modules-action/chachalog-default-config@v2
        if: ${{ steps.wl.outputs.whitelisted != 'true' }}

      - run: npx chachalog@^0.5 prepare-next-release
        if: ${{ steps.wl.outputs.whitelisted != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
